<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Project Board</title>
<link rel="stylesheet" href="style.css?v=7">
<script src="config.js?v=7"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<header id="top">
  <button id="btnSide" title="Danh mục (\)">☰</button>
  <b id="projName">Project Board</b>
  <div id="searchWrap">
    <input id="q" type="search" placeholder="Tìm trong tài liệu… (Ctrl+F)" autocomplete="off">
    <span id="qInfo"></span>
  </div>
  <div class="tools">
    <button id="btnEdit" title="Sửa bố cục: kéo trang, đổi chỗ bộ hồ sơ, vùng (E)">✎ Sửa bảng</button>
    <button id="btnFit" title="Xem toàn bộ (Shift+1)">⤢</button>
    <button id="btnNotes" title="Ẩn/hiện ghi chú, ghim, hình vẽ">👁</button>
    <select id="layoutSel" class="hidden" title="Chọn bố cục (mặc định / của tôi / của người khác)"></select>
    <button id="btnClaude" title="Bật/tắt cửa sổ Claude ở cạnh phải (Ctrl+Alt+C)">💬 Claude</button>
    <button id="btnWbs" class="hidden" title="WBS Dictionary – hạng mục kèm bản vẽ, SPEC, BOQ">WBS</button>
  </div>
  <span id="user"></span>
  <button id="btnLogin">Đăng nhập Google</button>
</header>
<aside id="side" class="hidden">
  <div id="sideTabs"><button data-tab="toc" class="on">Tài liệu</button><button data-tab="wbs" class="hidden">WBS</button></div>
  <div id="toc"></div>
  <div id="wbsList" class="hidden"></div>
</aside>
<aside id="wbsd" class="hidden">
  <div class="rhead"><span id="wbsdTitle">Chi tiết hạng mục</span><button id="wbsdClose">✕</button></div>
  <div id="wbsdBody"></div>
</aside>
<aside id="results" class="hidden">
  <div class="rhead"><span id="rCount"></span><button id="rClose">✕</button></div>
  <div id="rList"></div>
</aside>
<div id="drawbar">
  <button data-tool="select" class="on" title="Chọn / kéo (V)">↖</button>
  <button data-tool="note" title="Ghi chú dán (N)">🗒</button>
  <button data-tool="pin" title="Ghim lên trang (P)">📍</button>
  <span class="dsep"></span>
  <button data-tool="cloud" title="Đám mây (C) – kéo để vẽ">☁</button>
  <button data-tool="rect" title="Hình chữ nhật (R)">▭</button>
  <button data-tool="arrow" title="Mũi tên (A)">➚</button>
  <button data-tool="text" title="Chữ (T) – bấm vào chỗ cần ghi">T</button>
  <button data-tool="hl" title="Tô highlight (H) – kéo vùng cần tô">🖍</button>
  <span class="dsep"></span>
  <div id="colors"></div>
</div>
<div id="bars">
  <div id="editbar" class="bar hidden">
    <b>✎ Sửa bố cục</b>
    <button id="eAdd" title="Khôi phục bộ / trang đã gỡ khỏi bảng">↺ Khôi phục</button>
    <button id="eGroup" title="Thêm một vùng mới (4 vùng chính luôn giữ)">＋ Vùng</button>
    <button id="eUndo" title="Hoàn tác (Ctrl+Z)">↶</button>
    <button id="eRedo" title="Làm lại (Ctrl+Y)">↷</button>
    <button id="eReset" title="Bỏ hết thay đổi, về bố cục mặc định">Về mặc định</button>
    <button id="eDone" class="on">Xong</button>
  </div>
  <div id="selbar" class="bar hidden"></div>
</div>
<div id="modal" class="hidden"><div class="mbox"><div class="mhead"><b id="mTitle"></b><button id="mClose">✕</button></div><div id="mBody"></div></div></div>
<main id="viewport">
  <div id="world"></div>
  <div id="marq" class="hidden"></div>
  <div id="guides"></div>
  <div id="empty">
    <h2>Project Board</h2>
    <p id="emptyMsg">Đăng nhập Google để mở bảng.</p>
    <div id="folderBox" class="hidden">
      <p>Dán link thư mục dự án trên Google Drive (thư mục có chứa <code>_BOARD</code>):</p>
      <input id="folderInput" placeholder="https://drive.google.com/drive/folders/...">
      <button id="folderGo">Mở</button>
    </div>
  </div>
</main>
<div id="status"></div>
<div id="zoomInfo"></div>
<script src="lib/pdf.min.js?v=7"></script>
<script src="app.js?v=7"></script>
</body>
</html>
